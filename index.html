<style>
/* ====== Scope ทั้งหมดไว้ใต้ #withdraw-widget ====== */
#withdraw-widget *{box-sizing:border-box;}
#withdraw-widget .page-container{
  max-width:420px;width:100%;margin:auto;
  background:rgba(10,10,13,0.6);
  border-radius:14px;padding:12px;color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Prompt,sans-serif;
  box-shadow:0 0 20px rgba(255,200,0,.15);
  overflow:hidden;position:relative;
}

/* ====== HEADER ====== */
#withdraw-widget .header{margin-bottom:12px;display:flex;justify-content:center;}
#withdraw-widget .header-bar{
  display:flex;align-items:center;justify-content:center;width:100%;
  min-height:52px;padding:10px 16px;border-radius:16px;
  background:rgba(20,12,0,0.75);
  border:1px solid rgba(255,200,0,0.65);
  box-shadow:0 0 0 2px rgba(0,0,0,0.25) inset,0 10px 22px rgba(255,180,0,0.15),0 2px 6px rgba(0,0,0,0.35);
}
#withdraw-widget .title-glow{
  font-weight:900;font-size:20px;letter-spacing:.5px;line-height:1;
  background:linear-gradient(180deg,#ffe36b 0%, #ffc107 45%, #ff9f00 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 2px 0 rgba(0,0,0,0.35),0 0 12px rgba(255,200,0,0.35);
}

/* ====== Viewport + Track (ทำให้ไหล) ====== */
#withdraw-widget #viewport{
  height:330px; overflow:hidden; position:relative;
}
#withdraw-widget #track{
  display:flex; flex-direction:column; gap:8px;
  will-change: transform;
  transform: translateY(0);
  transition: transform .55s ease;
}

/* ====== Card ====== */
#withdraw-widget .notification{
  display:flex;align-items:center;gap:12px;
  background:rgba(30,30,35,0.6);
  border:1px solid rgba(255,200,0,.25);
  border-radius:12px;
  padding:10px;
  box-shadow:0 0 12px rgba(255,200,0,.1);
}

/* ====== LOGO BANK ====== */
#withdraw-widget .icon{
  width:46px;height:46px;border-radius:12px;padding:4px;
  background:transparent;
  border:1.5px solid rgba(255,200,0,0.7);
  box-shadow:0 0 8px rgba(255,200,0,0.4), inset 0 0 6px rgba(255,200,0,0.2);
  object-fit:contain;
}

/* ====== Status ====== */
#withdraw-widget .title-highlight p{margin:0;font-size:13px;line-height:1.35;}
#withdraw-widget .highlight{color:#ffcc00;font-weight:700;}
#withdraw-widget .status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:#ffcc00;white-space:nowrap;}
#withdraw-widget .badge-spin{
  width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(255,204,0,.35);border-top-color:#ffcc00;
  animation:spin 1s linear infinite;display:inline-block;
}
#withdraw-widget .status.done{color:#00f2a6;}
#withdraw-widget .badge-check{width:18px;height:18px;}

/* ====== Footer ====== */
#withdraw-widget .footer{
  display:flex;justify-content:center;align-items:center;
  width:100%;gap:6px;margin-top:8px;
  font-size:11px;color:#b8b8b8;
}

/* ====== Animations ====== */
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>

<div id="withdraw-widget">
  <div class="page-container">
    <div class="header">
      <div class="header-bar">
        <div class="title-glow">รายงานผลอันดับการถอนเงิน</div>
      </div>
    </div>

    <div id="viewport">
      <div id="track"></div>
    </div>

    <div class="footer">อัปเดตเมื่อ: <span id="lastUpdated">-</span></div>
  </div>
</div>

<script>
(function(){
  const root = document.getElementById('withdraw-widget'); if(!root) return;

  const BANK_LOGOS=[
'https://img2.pic.in.th/pic/BBL5623288bf3514827.png',
  'https://img2.pic.in.th/pic/KBANK188fb398741a931e.png',
  'https://img2.pic.in.th/pic/SCBb0fa8bfb34956394.png',
  'https://img5.pic.in.th/file/secure-sv1/TTB3c0909ac0f482074.png'
  ];

  const INTERVAL_MS = 2500;
  const MAX_CARDS   = 6;
  const track   = root.querySelector('#track');
  const updated = root.querySelector('#lastUpdated');

  let offset = 0;
  let itemStep = 0;

  function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function pickLogo(){ return BANK_LOGOS[rand(0,BANK_LOGOS.length-1)]; }
  function pad2(n){ return (n<10?'0':'')+n; }

  function nowThai(){
    const d=new Date();
    const day=pad2(d.getDate());
    const month=d.toLocaleString('th-TH',{month:'short'});
    const year=d.getFullYear()+543;
    const t=[pad2(d.getHours()),pad2(d.getMinutes()),pad2(d.getSeconds())].join(':');
    return `${day} ${month} ${year} ${t}`;
  }
  function updateTime(){
    updated.textContent = new Date().toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});
  }
  function svgCheck(){
    return `
      <svg class="badge-check" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="11" stroke="#00f2a6" stroke-width="2"></circle>
        <path d="M7 12.5l3.2 3.2L17 9.5" stroke="#00f2a6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>`;
  }

  function makeCard(){
    /* ✅ ยูสตามที่กำหนด + สุ่มเลขโทนเดียวกับตัวอย่าง */
    const prefixes = ["ufadmp01ca","ufadmp01ga","ufadmp01sa","ufadmp01fa"];
    const n = (Math.random() < 0.5) ? rand(10, 19) : rand(100, 109);
    const user = prefixes[rand(0, prefixes.length - 1)] + n + "xx";

    const amount=(rand(300,9999)+Math.random()).toFixed(2);
    const logo=pickLogo();

    const card=document.createElement('div');
    card.className='notification';
    card.innerHTML=`
      <img class="icon" src="${logo}" alt="bank">
      <div class="title-highlight">
        <p>ยูส: <span class="highlight">${user}</span></p>
        <p>ยอดถอน: <span class="highlight">${amount}</span> บาท</p>
        <p>วันที่: <span class="highlight">${nowThai()}</span></p>
      </div>
      <div class="status"><span class="badge-spin"></span> กำลังโอน...</div>
    `;

    setTimeout(()=>{
      const st=card.querySelector('.status');
      if(st){
        st.classList.add('done');
        st.innerHTML = svgCheck() + ' โอนแล้ว';
      }
    }, 1800);

    return card;
  }

  function recalcStep(){
    const first = track.querySelector('.notification');
    if(!first) return;
    const gap = 8;
    itemStep = first.getBoundingClientRect().height + gap;
  }

  function pushAndScroll(){
    const card = makeCard();
    track.prepend(card);

    recalcStep();
    updateTime();

    track.style.transition = 'none';
    offset -= itemStep;
    track.style.transform = `translateY(${offset}px)`;

    track.getBoundingClientRect();
    track.style.transition = 'transform .55s ease';
    offset += itemStep;
    track.style.transform = `translateY(${offset}px)`;

    setTimeout(()=>{
      while(track.children.length > MAX_CARDS){
        track.lastElementChild.remove();
      }
    }, 600);
  }

  for(let i=0;i<MAX_CARDS;i++){
    track.appendChild(makeCard());
  }
  updateTime();
  recalcStep();

  setInterval(pushAndScroll, INTERVAL_MS);
})();
</script>
